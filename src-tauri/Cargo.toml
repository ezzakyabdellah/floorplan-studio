[package]
name = "floorplan-studio"
version = "0.1.0"
description = "FloorPlan Studio - 2D drafting and 3D floor plan visualization"
authors = ["FloorPlan Studio"]
edition = "2021"

[lib]
name = "floorplan_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
