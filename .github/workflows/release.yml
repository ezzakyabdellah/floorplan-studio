name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
          - os: macos-latest
            name: macos
            bundles: dmg,app
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          CI: true

      - name: Stage installer files
        shell: bash
        run: |
          mkdir -p staged-installers
          case "${{ matrix.name }}" in
            windows)
              cp src-tauri/target/release/bundle/nsis/*.exe staged-installers/
              ;;
            linux)
              cp src-tauri/target/release/bundle/deb/*.deb staged-installers/
              cp src-tauri/target/release/bundle/appimage/*.AppImage staged-installers/
              ;;
            macos)
              cp src-tauri/target/release/bundle/dmg/*.dmg staged-installers/
              APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
              ditto -c -k --sequesterRsrc --keepParent "$APP" \
                "staged-installers/$(basename "$APP").zip"
              ;;
          esac
          ls -lh staged-installers

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: staged-installers/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: installers/**/*
          fail_on_unmatched_files: false
